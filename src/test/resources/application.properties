spring.application.name=operations

# In-Memory H2 Database for Hermetic Tests (PostgreSQL mode)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Disable auto-seeding in hermetic test suite (tested explicitly in DataLoaderTest)
app.seed.enabled=false
